services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./www:/var/www/html/www:ro
      - uploads:/var/www/html/www/uploads
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      NETTE_DEBUG: "0"
    volumes:
      - uploads:/var/www/html/www/uploads
      - logs:/var/www/html/log
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q 'NOTICE'"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  database:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/000_init.sql:ro
      - ./docker/migrations/001_add_status_to_users.sql:/docker-entrypoint-initdb.d/001_add_status_to_users.sql:ro
      - ./docker/migrations/002_add_deleted_at_to_users.sql:/docker-entrypoint-initdb.d/002_add_deleted_at_to_users.sql:ro
      - ./docker/migrations/003_ticket_soft_delete.sql:/docker-entrypoint-initdb.d/003_ticket_soft_delete.sql:ro
      - ./docker/migrations/004_blueprint_to_item_types.sql:/docker-entrypoint-initdb.d/004_blueprint_to_item_types.sql:ro
      - ./docker/migrations/005_notifications_link_url.sql:/docker-entrypoint-initdb.d/005_notifications_link_url.sql:ro
      - ./docker/migrations/006_email_log.sql:/docker-entrypoint-initdb.d/006_email_log.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  uploads:
  logs:
